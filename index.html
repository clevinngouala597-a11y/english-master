<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Master</title>
<meta name="description" content="Apprendre l’anglais avec des leçons vidéo adaptées à ton niveau, de l’oral, un coach et un suivi calé sur l’alternance.">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English Master">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout : une colonne de téléphone, navigation basse fixe. Thème noir unique (demandé). */
:root {
  /* Street / drop : noir, vert fluo, blanc cassé ; typo XXL condensée en capitales, étiquettes mono façon stickers. */
  color-scheme: dark;
  --bg: #0A0A0A;
  --s1: #141414;
  --s2: #1C1C1C;
  --s0: #101010;
  --line: #2B2B2B;
  --fg: #EDEBE4;
  --mut: #A3A09A;
  --dim: #6E6B66;
  --acc: #C8FF2E;
  --on-acc: #0A0A0A;
  --blue: #5CE1E6;
  --blue-bg: #0F2E30;
  --blue-fg: #9AF0F3;
  --org: #FF7A3D;
  --org-bg: #3A1A0E;
  --org-fg: #FFA27A;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Archivo", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 4px;
  --r: 8px;
  --r-lg: 10px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue-fg); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
mark { background: var(--acc); color: var(--on-acc); padding: 0 3px; border-radius: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 120px; display: flex; flex-direction: column; gap: 22px; min-height: 100%; }
#app.full { padding-bottom: 40px; }

/* Typo */
.display { font-family: var(--display); font-weight: 400; font-synthesis: none; text-transform: uppercase; letter-spacing: 0.005em; line-height: 0.98; }
.h1 { margin: 0; font-family: var(--display); font-weight: 400; font-synthesis: none; text-transform: uppercase; font-size: 52px; letter-spacing: 0.005em; line-height: 0.92; }
.h2 { margin: 0; font-family: var(--display); font-weight: 400; font-synthesis: none; text-transform: uppercase; font-size: 30px; letter-spacing: 0.005em; line-height: 0.98; }
.eyebrow { margin: 0; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: 0.12em; }
.muted { color: var(--mut); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
p { margin: 0; }

/* Blocs */
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 8px; align-items: center; }
.row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card-lg { border-radius: var(--r-lg); }
.card.tight { padding: 12px; }
.card.yellow { background: var(--acc); color: var(--on-acc); border: 0; }
.dashed { border: 1.5px dashed #3A3E46; border-radius: var(--r); padding: 16px; color: var(--mut); }
.divide > * + * { border-top: 1px solid var(--line); }

/* Boutons */
.btn { min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--s1); color: var(--fg); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--acc); color: var(--on-acc); border: 0; font-weight: 700; }
.btn.light { background: var(--fg); color: var(--bg); border: 0; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.dark { background: var(--bg); color: var(--fg); border: 0; }
.btn.big { min-height: 54px; font-size: 16px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; min-height: 44px; color: var(--blue-fg); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; align-self: flex-start; }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 22px; background: var(--s1); border: 1px solid var(--line); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; }
.round { border-radius: 999px; }
.seg { display: grid; gap: 4px; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 700; }
.seg.acc button[aria-pressed="true"] { background: var(--acc); color: var(--on-acc); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--s1); font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }

/* Pastilles d'état */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 7px; background: var(--s2); color: var(--fg); white-space: nowrap; }
.pill.blue { background: var(--blue-bg); color: var(--blue-fg); }
.pill.org { background: var(--org-bg); color: var(--org-fg); }
.pill.acc { background: var(--acc); color: var(--on-acc); }
.pill.light { background: var(--fg); color: var(--bg); }

/* Barres */
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--blue); }
.bar.org > i { background: var(--org); }
.bar.acc > i { background: var(--acc); }
.bar.none { background: transparent; border: 1px dashed #4A4E56; }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter .row-between { font-size: 14px; font-weight: 600; }

/* En-têtes */
.top { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.top .title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.top .title h1 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 800; }
.top .spacer { width: 44px; flex: none; }
.brand { display: flex; flex-direction: column; gap: 1px; }
.brand b { font-family: var(--display); font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.brand span { font-size: 11px; font-weight: 600; color: var(--mut); letter-spacing: 0.12em; text-transform: uppercase; }
.avatar { width: 44px; height: 44px; border-radius: 22px; background: var(--acc); color: var(--on-acc); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; border: 0; }

/* Navigation basse */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(17, 19, 22, 0.96); border-top: 1px solid var(--line); padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.nav .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.nav button { min-height: 50px; border: 0; background: transparent; color: var(--mut); font-size: 11px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.nav button[aria-current="page"] { color: var(--acc); font-weight: 700; }

/* Cartes leçon */
.tile { width: 64px; height: 64px; flex: none; border-radius: 14px; background: var(--s2); display: flex; align-items: center; justify-content: center; }
.tile.sm { width: 52px; height: 52px; border-radius: 12px; }
.lesson-card { width: 100%; text-align: left; background: var(--s1); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: flex; gap: 12px; align-items: flex-start; color: var(--fg); }
.lesson-card.is-rec { border: 2px solid var(--acc); padding: 11px; }
.lesson-card .t { font-size: 16px; font-weight: 700; }
.poster { width: 52px; height: 70px; flex: none; border-radius: 10px; display: flex; align-items: flex-end; padding: 6px; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; color: var(--bg); }
.poster.lg { width: 72px; height: 96px; font-size: 34px; padding: 8px; border-radius: 12px; }

/* Scène du lecteur */
.stage { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--s2); border: 1px solid var(--line); aspect-ratio: 358 / 214; max-width: 100%; }
.stage svg { display: block; width: 100%; height: 100%; }
.stage .tag { position: absolute; top: 10px; left: 10px; background: rgba(11, 12, 14, 0.85); font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 999px; }
.stage .subs { position: absolute; left: 10px; right: 10px; bottom: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.stage .subs .en { font-size: 17px; font-weight: 600; line-height: 1.3; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); }
.stage .subs .fr { font-size: 14px; color: #D2D4CE; line-height: 1.3; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); }
.controls { display: flex; align-items: center; justify-content: space-between; }
.ctl { width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--line); background: var(--s1); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; }
.ctl.play { width: 68px; height: 68px; border-radius: 34px; border: 0; background: var(--acc); color: var(--on-acc); }
.ctl.mic { background: var(--fg); color: var(--bg); border: 0; }
.progress { display: flex; gap: 3px; height: 8px; }
.progress > div { border-radius: 4px; background: var(--line); overflow: hidden; }
.progress > div > i { display: block; height: 100%; background: var(--acc); }

/* Sous-titres */
.line { padding: 12px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; }
.line.cur { background: var(--blue-bg); }
.line .head { display: flex; gap: 10px; }
.line .time { flex: none; width: 46px; height: 30px; border-radius: 8px; border: 0; background: var(--s2); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.line.cur .time { background: var(--acc); color: var(--on-acc); font-weight: 700; }
.line .sp { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mut); }
.line.cur .sp { color: var(--blue-fg); }
.line .en { font-size: 16px; line-height: 1.45; }
.line .fr { font-size: 14px; color: var(--mut); line-height: 1.45; }
.line.cur .fr { color: #C9CFE4; }
.word { border: 0; padding: 0; background: transparent; font: inherit; color: inherit; border-bottom: 2px dotted var(--blue); }
.word.on { background: var(--acc); color: var(--on-acc); border-radius: 4px; padding: 0 3px; border-bottom-color: transparent; }
.wordcard { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

/* Bulles (coach, jeu de rôle) */
.bubble { max-width: 86%; padding: 11px 14px; font-size: 15px; line-height: 1.5; border-radius: 20px; white-space: pre-line; }
.bubble.them { align-self: flex-start; background: var(--s1); border: 1px solid var(--line); border-top-left-radius: 6px; }
.bubble.me { align-self: flex-end; background: var(--acc); color: var(--on-acc); border-top-right-radius: 6px; font-weight: 500; }
.who { display: flex; gap: 8px; align-items: flex-end; }
.face { width: 32px; height: 32px; flex: none; border-radius: 16px; background: var(--blue); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
.mic-big { width: 96px; height: 96px; border-radius: 48px; border: 6px solid var(--bg); background: var(--acc); color: var(--on-acc); display: inline-flex; align-items: center; justify-content: center; }
.mic-big.on { border-color: var(--fg); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(200, 255, 46, 0.22); } }
@media (prefers-reduced-motion: reduce) { .mic-big.on { animation: none; } }

/* Formulaires */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--mut); }
.input { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); padding: 10px 14px; font-size: 16px; color: var(--fg); }
textarea.input { resize: vertical; min-height: 84px; line-height: 1.45; }
.input:focus { border-color: var(--fg); outline: none; }
.choice { width: 100%; text-align: left; min-height: 48px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); font-size: 15px; }
.choice[aria-pressed="true"] { border: 2px solid var(--fg); padding: 11px 13px; }
.choice.good { border: 2px solid var(--blue); background: var(--blue-bg); color: var(--blue-fg); padding: 11px 13px; }
.choice.bad { border: 2px solid var(--org); background: var(--org-bg); color: var(--org-fg); padding: 11px 13px; }
.fb { font-size: 14px; line-height: 1.45; border-radius: 10px; padding: 10px 12px; }
.fb.good { background: var(--blue-bg); color: var(--blue-fg); }
.fb.bad { background: var(--org-bg); color: var(--org-fg); }

/* Calendrier */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .d { height: 44px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: var(--s0); color: var(--dim); font-variant-numeric: tabular-nums; }
.cal .d.done { background: var(--acc); color: var(--on-acc); }
.cal .d.review { background: var(--blue-bg); color: var(--blue-fg); }
.cal .d.missed { background: transparent; border: 1.5px solid var(--org); color: var(--org); }
.cal .d.rest { color: var(--mut); font-weight: 500; }
.cal .d.today { background: transparent; border: 2px solid var(--acc); color: var(--fg); }
.cal .d.is-today.done, .cal .d.is-today.review { outline: 2px solid var(--fg); outline-offset: 1px; }
table.evo { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.evo th, table.evo td { padding: 11px 0; text-align: right; }
table.evo th:first-child { text-align: left; }
table.evo thead th { color: var(--mut); font-size: 12px; font-weight: 600; }
table.evo tbody tr { border-top: 1px solid var(--line); }

/* Divers */
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 999px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4); }
.dots::after { content: "…"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.ring { flex: none; }
.list-row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; }
.notice { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: var(--mut); }
.notice svg { flex: none; margin-top: 1px; }
.stat { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 12px; }
.stat b { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1.1; }
.stat.warn { background: var(--org-bg); border-color: #5A3A20; color: var(--org-fg); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.steps-bar { display: grid; gap: 4px; }
.steps-bar i { height: 6px; border-radius: 3px; background: var(--line); }
.steps-bar i.ok { background: var(--blue); }
.steps-bar i.ko { background: var(--org); }
.steps-bar i.cur { background: var(--acc); }
.steps-bar i.skip { background: #4A4E56; }
.chapters { display: flex; gap: 3px; font-size: 12px; color: var(--mut); }

/* Vidéo YouTube */
.yt-frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r-lg); overflow: hidden; background: #000; border: 1px solid var(--line); }
.yt-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.yt-loading { pointer-events: none; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mut); font-size: 14px; }
input[type="range"] { accent-color: var(--acc); width: 100%; min-height: 32px; }
dt, dd { min-width: 0; overflow-wrap: anywhere; }

/* Shadowing */
.countdown { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.countdown i { display: block; height: 100%; width: 100%; background: var(--acc); animation-name: shrink; animation-timing-function: linear; animation-fill-mode: forwards; }
@keyframes shrink { from { width: 100%; } to { width: 0; } }

/* ---------- Street / drop ---------- */
[style*="font-weight:800"].display, .display[style*="font-weight"] { font-weight: 400 !important; }
.btn { white-space: nowrap; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 800; font-size: 14px; border-width: 2px; }
.btn.primary { box-shadow: 3px 3px 0 var(--fg); }
.btn.primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--fg); }
.btn.light { box-shadow: 3px 3px 0 var(--acc); }
.link { text-transform: uppercase; font-size: 13px; letter-spacing: 0.04em; font-weight: 800; color: var(--acc); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.pill { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; border-radius: 3px; padding: 4px 7px; }
.pill.light { background: var(--fg); color: var(--bg); }
.chip { border-radius: 4px; font-family: var(--mono); text-transform: uppercase; font-size: 12px; letter-spacing: 0.04em; font-weight: 700; border-width: 2px; }
.seg { border-radius: 6px; border-width: 2px; }
.seg button { border-radius: 3px; text-transform: uppercase; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg.acc button[aria-pressed="true"] { background: var(--acc); color: var(--on-acc); }
.card { border-width: 2px; }
.card.yellow { box-shadow: 4px 4px 0 var(--fg); }
.lesson-card { border-radius: 8px; border-width: 2px; }
.lesson-card .t { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 22px; line-height: 1; letter-spacing: 0.01em; }
.lesson-card.is-rec { border-color: var(--acc); }
.tile { border-radius: 6px; }
.stat b { font-weight: 400; font-size: 36px; }
.stat { border-width: 2px; border-radius: 8px; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 24px; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1; }
.brand b i { font-style: normal; color: var(--acc); }
.brand span { font-family: var(--mono); letter-spacing: 0.16em; }
.top .title h1 { font-weight: 400; text-transform: uppercase; font-size: 22px; letter-spacing: 0.01em; }
.nav button { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; font-weight: 700; }
.nav button[aria-current="page"] { color: var(--acc); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 0 6px rgba(200, 255, 46, 0.45)); }
.avatar { border-radius: 6px; font-family: var(--display); font-weight: 400; font-size: 20px; }
.input { border-radius: 6px; border-width: 2px; }
.choice { border-radius: 6px; border-width: 2px; }
.mic-big { border-radius: 50%; }
.time-chip { white-space: nowrap; }
.sticker { display: inline-block; background: var(--acc); color: var(--on-acc); font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 9px; transform: rotate(-3deg); box-shadow: 2px 2px 0 var(--bg); }
.sticker.white { background: var(--fg); transform: rotate(2deg); }

  function openOral(v, fromTab) {
    var p = String(v || "").split(":");

  function rpAdvance() {
    var O = ui.oral, l = E.lessonById(O.id);
    O.waiting = false;
    function step() {
      if (ui.route !== "oral" || ui.oral !== O) return;
      if (O.pos >= l.lines.length) { rpFinish(); return; }
      var ln = l.lines[O.pos];
      if (ln.sp === "Toi") { O.waiting = true; O.help = false; render(); return; }
      O.log.push({ text: ln.en, sp: ln.sp });
      O.pos++;
      render();
      TTS.speak(ln.en, { lang: l.lang, rate: 0.95 }).then(function () { setTimeout(step, 300); });
    }
    step();
  }
  async function rpAnswer(text, voice) {
    var O = ui.oral, l = E.lessonById(O.id), ln = l.lines[O.pos];
    if (!text || !text.trim()) { toast("Réponds d’abord, à l’oral ou par écrit."); return; }
    ui.f.rp = "";
    var entry = { me: true, text: text, voice: !!voice };
    O.log.push(entry); O.waiting = false; O.busy = true;
    render();
    var prev = O.log.filter(function (m) { return !m.me; }).slice(-1)[0];
    var local = E.scoreRoleplay(ln, text);
    var fb = null;
    if (AI.on) {
      try {
        var r = await AI.json("Tu corriges un élève francophone de niveau " + l.level + " dans un jeu de rôle en anglais (« " + l.title + " »). Le partenaire (" + l.partner + ") vient de dire : « " + (prev ? prev.text : "") + " ». Réponse modèle possible : « " + ln.en + " ». L’élève a répondu" + (voice ? " (transcription automatique de sa voix, sans ponctuation fiable)" : "") + " : « " + text + " ».\nAccepte toute réponse naturelle et adaptée, même différente du modèle. Réponds uniquement avec un objet JSON : {\"understood\": true|false, \"score\": entier de 0 à 100, \"better\": \"une version naturelle et correcte en anglais\", \"feedback\": \"30 mots maximum, en français, tutoiement, concret\", \"concept\": une clé parmi " + JSON.stringify(Object.keys(C.CONCEPTS)) + " ou null}");
        if (r && typeof r.score === "number") fb = { understood: !!r.understood, score: Math.max(0, Math.min(100, Math.round(r.score))), better: String(r.better || ""), feedback: String(r.feedback || ""), concept: C.CONCEPTS[r.concept] ? r.concept : null, local: false };
      } catch (e) { }
    }
    if (!fb) {
      fb = { understood: local.understood, score: local.pct, better: ln.en, local: true, concept: null,
        feedback: local.understood ? (local.missing.length ? "Compris. Pour être plus naturel, tu peux dire :" : "Très bien, c’est clair et naturel. Exemple de version complète :") : "Pas encore clair. Il manque « " + ((local.missing[0] || [""])[0]) + " ». Exemple :" };
    }
    entry.fb = fb;
    O.scores.push(fb.score);
    if (fb.concept) E.addConcept(S, fb.concept, O.id, E.today());
    O.busy = false; O.pos++;
    save();
    rpAdvance();
  }
  function rpFinish() {
    var O = ui.oral;
    O.done = true; O.waiting = false;
    var sc = O.scores.length ? Math.round(O.scores.reduce(function (a, b) { return a + b; }, 0) / O.scores.length) : 0;
    E.recordResult(S, O.id, "roleplay", sc, E.today());
    E.logDay(S, E.today(), "oral", (Date.now() - O.t0) / 60000);
    save();

      return r.pct >= E.MASTERY ? "ok" : "ko";

      var ys = ui.player.ysh;
      if (YTM.state === 1) { YTM.call("pauseVideo"); return; }
      if (ys.on && ys.phase === "turn") { A["ysh-next"](); return; }
      if (ys.on) { ys.start = YTM.cur; ys.end = YTM.cur + ys.len; ys.phase = "play"; }
      YTM.call("playVideo");
    },
    "yt-back": function () { var t = Math.max(0, YTM.cur - 5); YTM.call("seekTo", t, true); YTM.cur = t; var ys = ui.player.ysh; if (ys.on) { ys.start = t; ys.end = t + ys.len; ys.phase = "play"; } YTM.call("playVideo"); },
    "yt-fwd": function () { var t = Math.min(YTM.dur || Infinity, YTM.cur + 10); YTM.call("seekTo", t, true); YTM.cur = t; var ys = ui.player.ysh; if (ys.on) { ys.start = t; ys.end = t + ys.len; ys.phase = "play"; } },
    "yt-rate": function (v) { YTM.call("setPlaybackRate", Number(v)); YTM.rate = Number(v); ytRefresh(); },
    "ysh-toggle": function () { var ys = ui.player.ysh; ys.on = !ys.on; ys.start = YTM.cur; ys.end = YTM.cur + ys.len; ys.phase = "play"; ytRefresh(); },
    "ysh-len": function (v) { var ys = ui.player.ysh; ys.len = Number(v); ys.end = ys.start + ys.len; ytRefresh(); },
    "ysh-replay": function () { var ys = ui.player.ysh; YTM.call("seekTo", ys.start, true); YTM.cur = ys.start; ys.end = ys.start + ys.len; ys.phase = "play"; YTM.call("playVideo"); E.logDay(S, E.today(), "oral", 0); ytRefresh(); },
    "ysh-next": function () { var ys = ui.player.ysh; ys.start = ys.end; ys.end = ys.start + ys.len; ys.phase = "play"; YTM.call("playVideo"); E.logDay(S, E.today(), "oral", 0); ytRefresh(); },
    "v-watched": function () { YTM.lesson = ui.player.id; var v = YTM.lv(); v.done = true; v.pct = 100; E.logDay(S, E.today(), "watch", 0); save(); toast("Vidéo notée comme vue. Place aux exercices."); render(); },
    "sh-play": function () {
      var sh = ui.oral.sh;
      if (sh.phase === "listen" || sh.phase === "turn") { shStop(sh); sh.phase = "paused"; render(); }
      else shStep();
    },
    "sh-replay": function () { var sh = ui.oral.sh; shStop(sh); shStep(); },
    "sh-next": function () { var sh = ui.oral.sh, n = E.lessonById(ui.oral.id).lines.length; shStop(sh); sh.round = 0; sh.reveal = false; sh.i = Math.min(n, sh.i + 1); if (sh.i >= n) shFinish(); else shStep(); },
    "sh-text": function (v) { ui.oral.sh.text = v; render(); },
    "sh-speed": function (v) { ui.oral.sh.speed = Number(v); render(); },
    "sh-rounds": function (v) { ui.oral.sh.rounds = Number(v); render(); },
    "sh-mic": function () { ui.oral.sh.mic = !ui.oral.sh.mic; render(); },
    "sh-reveal": function () { ui.oral.sh.reveal = true; render(); },
    "sh-rate": function (v) { var sh = ui.oral.sh; sh.rating = v; if (v === "difficile") E.addConcept(S, "prononciation", ui.oral.id, E.today()); save(); render(); },
    "sh-restart": function (v) { var old = ui.oral.sh, sh = shState(); sh.text = v || old.text; sh.speed = old.speed; sh.rounds = old.rounds; sh.mic = old.mic; ui.oral.sh = sh; render(); window.scrollTo(0, 0); },
    "add-heard": async function () {
      var txt = (ui.f.heard || "").trim();
      if (!txt) { toast("Écris la réplique d’abord."); return; }
      var t = E.today(), en = txt, fr = "";
      if (AI.on) {
        ui.busyHeard = true; render();
        try {
          var r = await AI.json("Un élève francophone a noté une réplique entendue dans une série en anglais : « " + txt + " ». Corrige-la si besoin (orthographe, ponctuation) sans changer le sens, et traduis-la. Réponds uniquement avec un objet JSON : {\"en\": \"la réplique corrigée\", \"fr\": \"traduction naturelle\"}");
          if (r && r.en) { en = String(r.en); fr = String(r.fr || ""); }
        } catch (e) { }
        ui.busyHeard = false;
      }
      E.addWord(S, { en: en, fr: fr }, null, "watch", t);
      ui.f.heard = ""; save();
      toast("Ajouté à tes révisions"); render();
    },
    play: function () { if (ui.player.playing) { pausePlayer(); playerTick(); } else playPlayer(); },
    "seg-prev": function () { jumpTo(ui.player.idx - 1); },
    "seg-next": function () { jumpTo(ui.player.idx + 1); },
    "seg-replay": function () { jumpTo(ui.player.idx, true); },
    chapter: function (v) { var c = Number(v), i = ui.player.segs.map(function (s) { return s.chapter; }).indexOf(c); jumpTo(i); },
    "goto-line": function (v) { var i = ui.player.segs.map(function (s) { return s.chapter === 0 && s.line; }).indexOf(Number(v)); jumpTo(i === -1 ? 0 : i, true); },
    speed: function (v) { ui.player.speed = Number(v); ui.lastSpeed = Number(v); playerTick(); },
    "toggle-fr": function () { ui.player.fr = !ui.player.fr; playerTick(); },
    "toggle-en": function () { ui.player.en = !ui.player.en; playerTick(); },
    word: function (v) { var p = v.split(":"); var P = ui.player; P.card = P.card && P.card.key === p[1] && P.card.line === Number(p[0]) ? null : { line: Number(p[0]), key: p[1] }; playerTick(); },
    "close-card": function () { ui.player.card = null; playerTick(); },
    "say-word": function (v) { var l = E.lessonById(ui.player.id); var w = l.vocab.filter(function (x) { return x.key === v; })[0]; var o = { lang: l.lang, rate: 0.9 * ui.player.speed }, my = ++ui.sayTok; TTS.cancel(); TTS.speak(w.en, o).then(function () { if (w.ex && my === ui.sayTok) setTimeout(function () { if (my === ui.sayTok) TTS.speak(w.ex, o); }, 350); }); },
    "say-line": function (v) { var l = E.lessonById(ui.player.id); TTS.speak(l.lines[Number(v)].en, { lang: l.lang, rate: ui.player.speed }); },
    "save-word": function (v) {
      var l = E.lessonById(ui.player.id), w = l.vocab.filter(function (x) { return x.key === v; })[0], k = l.id + ":" + v;
      if (S.words[k]) { delete S.words[k]; toast("Retiré de tes mots"); } else { E.addWord(S, w, l.id, "saved", E.today()); toast("Ajouté à tes mots"); }
      save(); playerTick();
    },
    fav: function () { S.favs = S.favs || []; var id = ui.player.id, i = S.favs.indexOf(id); if (i === -1) { S.favs.push(id); toast("Leçon ajoutée aux favoris"); } else S.favs.splice(i, 1); save(); playerTick(); },
    say: function (v) { var l = E.lessonById(ui.oral.id); TTS.speak(v, { lang: l.lang, rate: 0.95 }); },
    "say-plain": function (v) { var p = v.split("|"); TTS.speak(p[0], { lang: p[1] || "en-US", rate: 0.9 }); },
    "open-oral": function (v) { openOral(v, false); },
    "oral-mode": function (v) { TTS.cancel(); STT.stop(); ui.oral = oralState(ui.oral.id, v); render(); },
    "oral-lesson": function (v) { TTS.cancel(); STT.stop(); ui.oral = oralState(v, ui.oral.mode); render(); },
    "rp-start": function () { var O = ui.oral; O.started = true; O.t0 = Date.now(); rpAdvance(); },
    "rp-restart": function () { var O = ui.oral; ui.oral = oralState(O.id, "role"); ui.oral.started = true; rpAdvance(); },
    "rp-help": function () { ui.oral.help = !ui.oral.help; render(); },
    "rp-send": function () { rpAnswer(ui.f.rp || "", false); },
    "rp-mic": function () {
      var O = ui.oral, l = E.lessonById(O.id);
      if (O.listening) { STT.stop(); return; }
      TTS.cancel(); O.listening = true; render();
      STT.listen(l.lang).then(function (alts) { O.listening = false; var ln = l.lines[O.pos]; var best = alts.slice().sort(function (a, b) { return E.scoreRoleplay(ln, b).pct - E.scoreRoleplay(ln, a).pct; })[0]; rpAnswer(best, true); })
        .catch(function (err) { O.listening = false; toast(micMessage(err)); render(); });
    },
    "rep-listen": function (v) { var O = ui.oral, l = E.lessonById(O.id); TTS.speak(O.targets[O.t].en, { lang: l.lang, rate: Number(v) }); },
    "rep-mic": function () {
      var O = ui.oral, l = E.lessonById(O.id);
      if (O.listening) { STT.stop(); return; }
      TTS.cancel(); O.listening = true; render();
      STT.listen(l.lang).then(function (alts) {
        O.listening = false;
        var target = O.targets[O.t].en;
        var best = null, heard = "";
        alts.forEach(function (a) { var r = E.scoreRepeat(target, a); if (!best || r.pct > best.pct) { best = r; heard = a; } });
        best.heard = heard;
        O.result = best; O.attempts.push(best.pct);
        E.logDay(S, E.today(), "oral", 0.5);
        if (best.pct < 70) E.addConcept(S, "prononciation", O.id, E.today());
        save(); render();
      }).catch(function (err) { O.listening = false; toast(micMessage(err)); render(); });
    },
    "rep-next": function () {
      var O = ui.oral;
      if (O.attempts.length) E.recordResult(S, O.id, "repeat", Math.max.apply(null, O.attempts), E.today());
      save();
      if (O.t < O.targets.length - 1) { O.t++; O.result = null; O.attempts = []; render(); window.scrollTo(0, 0); }
      else { toast("Répétition terminée"); go(ui.player && ui.player.id === O.id ? "player" : "home"); }
    },
    "start-ex": function (v) { startEx(v); },
    "close-ex": function () { if (ui.player && ui.player.id === ui.ex.id) go("player"); else go("home"); },
    "ex-pick": function (v) { var X = ui.ex, t = X.steps[X.i].type, p = v.split(":"); X.ans[t] = X.ans[t] || []; X.ans[t][Number(p[0])] = Number(p[1]); render(); },
    "ex-check": function () { exCheck(); },
    "ex-next": function () { exNext(); },
    "ex-say": function (v) { var l = E.lessonById(ui.ex.id); TTS.speak(l.exercises.dictation.en, { lang: l.lang, rate: Number(v) }); },
    "ex-say-oral": function () { var l = E.lessonById(ui.ex.id); TTS.speak(l.exercises.oral.en, { lang: l.lang, rate: 0.9 }); },
    "ex-skip": function () { var X = ui.ex; X.res[X.i] = { skipped: true, pct: 0 }; render(); },
    "ex-mic": function () {
      var X = ui.ex, l = E.lessonById(X.id);
      if (ui.dictating) { STT.stop(); return; }
      TTS.cancel(); ui.dictating = "oral"; render();
      STT.listen(l.lang).then(function (alts) {
        ui.dictating = null;
        var best = null, heard = "";
        alts.forEach(function (a) { var r = E.scoreRepeat(l.exercises.oral.en, a); if (!best || r.pct > best.pct) { best = r; heard = a; } });
        best.heard = heard;
        X.res[X.i] = best;
        E.recordResult(S, X.id, "oral", best.pct, E.today());
        E.logDay(S, E.today(), "oral", 0.5);
        if (best.pct < 70) noteConcept(X, "prononciation");
        save(); render();
      }).catch(function (err) { ui.dictating = null; toast(micMessage(err)); render(); });
    },
    dictate: function (v) {
      if (ui.dictating) { STT.stop(); return; }
      var lang = ui.ex ? E.lessonById(ui.ex.id).lang : "en-US";
      ui.dictating = v; render();
      STT.listen(lang).then(function (alts) { ui.dictating = null; ui.f[v] = alts[0]; render(); }).catch(function (err) { ui.dictating = null; toast(micMessage(err)); render(); });
    },
    "open-coach": function (v) { openCoach(v); },
    "coach-send": function () { coachSend(ui.f.coach || "", false); },
    "coach-quick": function (v) { coachQuick(v); },
    "coach-mic": function () {
      if (ui.dictating) { STT.stop(); return; }
      ui.dictating = "coach";
      toast("Parle en français ou en anglais");
      STT.listen("fr-FR").then(function (alts) { ui.dictating = null; coachSend(alts[0], true); }).catch(function (err) { ui.dictating = null; toast(micMessage(err)); });
    },
    "plan-add": function (v) {
      var K = ui.coach, m = K.msgs[Number(v)], today = E.today();
      m.plan.forEach(function (s, k) { S.plan.push({ id: "p" + Date.now() + k, due: whenToDate(s.when, today), when: s.when, title: s.title, detail: s.detail, minutes: s.minutes || 2, lesson: K.id, done: false }); });
      m.added = true; save(); toast("Plan ajouté à ton suivi"); render();
    },
    "coach-finish": function () { coachFinish(); },
    "open-bilan": function (v) {
      var b = S.bilans[Number(v)];
      if (!b) return;
      ui.coach = { id: b.lesson, msgs: b.msgs.map(function (m) { return { r: m.r, t: m.t, plan: m.plan }; }), readOnly: true, date: b.d, sent: 0 };
      go("coach");
    },
    "suivi-view": function (v) { ui.suivi = v; render(); },
    "start-review": function () { startReview(); },
    "rev-reveal": function () { ui.review.reveal = true; render(); },
    "rev-mark": function (v) { reviewMark(v === "1"); },
    "rev-check": function () {
      var R = ui.review, it = R.queue[R.i], def = C.CONCEPTS[it.key], ans = ui.f.rev || "";
      if (!ans.trim()) { toast("Écris ta réponse d’abord."); return; }
      var ok = E.matchesAccepted(ans, def.retry.accept) || E.keyGroups(ans, def.retry.keys).ratio === 1;
      R.checked = { ok: ok }; render();
    },
    "rev-next": function () { reviewMark(ui.review.checked && ui.review.checked.ok); },
    "ask-del": function (v) { ui.confirm = "del:" + v; render(); },
    "del-word": function (v) { delete S.words[v]; ui.confirm = null; save(); toast("Mot supprimé"); render(); }
  };

  /* ---------- Démarrage ---------- */
  function boot() {
    TTS.load();
    document.addEventListener("click", function (e) {
      NV.unlock();
      var t = e.target.closest("[data-a]");
      if (!t || t.disabled) return;
      var fn = A[t.getAttribute("data-a")];
      if (fn) { e.preventDefault(); fn(t.getAttribute("data-v"), t, e); }
    });
    document.addEventListener("input", function (e) {
      var t = e.target;
      if (t.getAttribute("data-f")) {
        ui.f[t.getAttribute("data-f")] = t.value;
        if (t.getAttribute("data-live") === "lib") { ui.lib.q = t.value; var box = document.getElementById("lib-list"); if (box) box.innerHTML = libList(); }
      }
      if (t.getAttribute("data-a-input") === "volume" && ui.player) ui.player.volume = Number(t.value) / 100;
      if (t.getAttribute("data-yt") === "seek") { YTM.drag = true; var tt = document.getElementById("yt-time"); if (tt) tt.textContent = mmss(Number(t.value)) + " / " + (YTM.dur ? mmss(YTM.dur) : "–"); }
      if (t.getAttribute("data-yt") === "vol" && ui.player) { ui.player.ytVol = Number(t.value); YTM.call("setVolume", Number(t.value)); }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || e.shiftKey) return;
      var id = e.target && e.target.id;
      if (id === "f-coach") { e.preventDefault(); A["coach-send"](); }
      else if (id === "f-rp") { e.preventDefault(); A["rp-send"](); }
      else if (id === "f-heard") { e.preventDefault(); A["add-heard"](); }
      else if (id === "f-rev") { e.preventDefault(); if (ui.review && !ui.review.checked) A["rev-check"](); }
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { YTM.flush(); if (ui.oral && ui.oral.sh && (ui.oral.sh.phase === "listen" || ui.oral.sh.phase === "turn")) { shStop(ui.oral.sh); ui.oral.sh.phase = "paused"; } }
      if (document.hidden && ui.player && ui.player.playing) { pausePlayer(); playerTick(); }
    });
    document.addEventListener("change", function (e) {
      var t = e.target;
      if (t.getAttribute("data-yt") === "seek") {
        var v = Number(t.value); YTM.drag = false; YTM.call("seekTo", v, true); YTM.cur = v;
        var ys = ui.player && ui.player.ysh; if (ys) { ys.start = v; ys.end = v + ys.len; ys.phase = "play"; }
      }
    });
    window.addEventListener("online", function () { if (ui.route === "player" && ui.player && ui.player.tab === "video" && !YTM.player) { render(); if (!IN_CLAUDE) YTM.mount(ui.player.id); } });
    render();
    AI.init().then(function () { if (["coach", "home", "watch", "oral"].indexOf(ui.route) !== -1 && !document.activeElement.matches("input,textarea")) render(); });
    Cloud.init();
    if (!IN_CLAUDE && "serviceWorker" in navigator && location.protocol === "https:") {
      try { navigator.serviceWorker.register("sw.js").catch(function () { }); } catch (e) { }
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
